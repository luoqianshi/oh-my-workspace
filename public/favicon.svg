<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Neumorphism 凸起阴影滤镜 -->
    <filter id="neu-raised" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="#a3b1c6" flood-opacity="1"/>
      <feDropShadow dx="-3" dy="-3" stdDeviation="3" flood-color="#ffffff" flood-opacity="1"/>
    </filter>
    <!-- Neumorphism 凹陷阴影滤镜 -->
    <filter id="neu-inset" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#a3b1c6" flood-opacity="0.8"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.8"/>
    </filter>
    <!-- 小元素凸起 -->
    <filter id="neu-small" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="1.5" stdDeviation="1.5" flood-color="#a3b1c6" flood-opacity="0.9"/>
      <feDropShadow dx="-1.5" dy="-1.5" stdDeviation="1.5" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
    <!-- 主色渐变 - 靛蓝色（研究生小骆主题色） -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C73FF"/>
      <stop offset="100%" style="stop-color:#5C53DF"/>
    </linearGradient>
    <!-- 工具箱箱体渐变 -->
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8ECF2"/>
      <stop offset="100%" style="stop-color:#D8DCE4"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 - Cool Grey -->
  <rect width="64" height="64" rx="14" ry="14" fill="#E0E5EC"/>

  <!-- 工具箱主体 - 拟态凸起效果 -->
  <rect x="10" y="22" width="44" height="30" rx="8" ry="8" 
        fill="url(#box-grad)" filter="url(#neu-raised)"/>

  <!-- 工具箱提手 -->
  <path d="M24 22 V17 C24 13, 40 13, 40 17 V22" 
        fill="none" stroke="#C4CAD4" stroke-width="3" stroke-linecap="round"
        filter="url(#neu-small)"/>
  <path d="M24 22 V17 C24 13, 40 13, 40 17 V22" 
        fill="none" stroke="#E0E5EC" stroke-width="2" stroke-linecap="round"/>

  <!-- 箱体分隔线（凹陷效果） -->
  <line x1="10" y1="37" x2="54" y2="37" stroke="#C8CDD6" stroke-width="1" opacity="0.6"/>

  <!-- 箱体锁扣/装饰点 -->
  <circle cx="32" cy="37" r="2.5" fill="#D0D5DE" filter="url(#neu-inset)"/>

  <!-- 扳手图标 - 左侧 -->
  <g transform="translate(17, 25) scale(0.6)" filter="url(#neu-small)">
    <path d="M3 17L10.5 9.5C10 8, 10 6, 11 4.5C12.5 2.5, 15.5 2, 17.5 3.5L14 7L15 9L17 9.5L20.5 6C22 8, 21.5 11, 19.5 12.5C18 13.5, 16 13.5, 14.5 13L7 20.5C6 21.5, 4.5 21.5, 3.5 20.5C2.5 19.5, 2 18, 3 17Z" 
          fill="url(#primary-grad)" opacity="0.9"/>
  </g>

  <!-- 齿轮图标 - 右侧 -->
  <g transform="translate(35, 24) scale(0.55)" filter="url(#neu-small)">
    <path d="M12 0L13.5 3.5L17 4L14.5 6.5L15 10L12 8.5L9 10L9.5 6.5L7 4L10.5 3.5Z" 
          fill="url(#primary-grad)" opacity="0.9"/>
    <circle cx="12" cy="5.5" r="2.5" fill="#E0E5EC"/>
  </g>

  <!-- 星星点缀 - 右上角 -->
  <g transform="translate(44, 12) scale(0.5)" filter="url(#neu-small)">
    <path d="M5 0L6.5 3.5L10 4L7.5 6.5L8 10L5 8.5L2 10L2.5 6.5L0 4L3.5 3.5Z" 
          fill="#ec4899" opacity="0.8"/>
  </g>
</svg>
